[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llminferchar"
version = "0.1.0"
description = "Empirical characterization framework for self-hosted agentic LLM inference"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["llminferchar*"]